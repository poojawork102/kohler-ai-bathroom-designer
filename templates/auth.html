{% extends "base.html" %}
{% block title %}Sign In | KOHLER Architectural Studio{% endblock %}

{% block content %}
<section class="section wrap" style="display: flex; justify-content: center; padding: 60px 24px;">
    <div class="auth-container card" style="width: 100%; max-width: 400px;">
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">SIGN IN</button>
            <button class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">SIGN UP</button>
        </div>

        <form id="form-login" class="auth-form" action="{{ url_for('login') }}" method="POST">
            <h2 class="card-title" style="text-align: center; margin-top: 20px;">Welcome Back</h2>
            <div class="field" style="margin-bottom: 16px;">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" name="email" required>
            </div>
            <div class="field" style="margin-bottom: 24px;">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">SIGN IN</button>
            
            <div style="margin: 20px 0; text-align: center; color: var(--ink-muted); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;">or</div>
            
            <button type="submit" class="btn btn-ghost" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <svg width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                CONTINUE WITH GOOGLE
            </button>
        </form>

        <form id="form-signup" class="auth-form" style="display: none;" action="{{ url_for('login') }}" method="POST">
            <h2 class="card-title" style="text-align: center; margin-top: 20px;">Create an Account</h2>
            <div class="field" style="margin-bottom: 16px;">
                <label for="signup-name">Full Name</label>
                <input type="text" id="signup-name" name="name" required>
            </div>
            <div class="field" style="margin-bottom: 16px;">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" name="email" required>
            </div>
            <div class="field" style="margin-bottom: 16px;">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" name="password" required>
            </div>
            <div class="field" style="margin-bottom: 24px;">
                <label for="signup-profession">Profession</label>
                <select id="signup-profession" name="profession" required>
                    <option value="" disabled selected>Select your profession</option>
                    <option value="Homeowner">Homeowner</option>
                    <option value="Architect">Architect</option>
                    <option value="Interior Designer">Interior Designer</option>
                </select>
            </div>
            <button type="submit" class="btn" style="width: 100%;">SIGN UP</button>
        </form>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    function switchAuthTab(tab) {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.style.display = 'none');
        
        document.getElementById('tab-' + tab).classList.add('active');
        document.getElementById('form-' + tab).style.display = 'block';
    }
</script>
{% endblock %}

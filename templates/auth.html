{% extends "base.html" %}
{% block title %}Sign In | KOHLER Architectural Studio{% endblock %}

{% block content %}
<section class="section wrap" style="display: flex; justify-content: center; padding: 60px 24px;">
<div style="background: #FFFFFF; width: 400px; margin: 60px auto; padding: 45px 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border-radius: 8px; text-align: center; border-top: 4px solid #111;">
    
    <!-- Bold KOHLER Logo -->
    <h1 style="font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 900; letter-spacing: 6px; color: #111; margin: 0 0 30px 0; text-transform: uppercase;">KOHLER</h1>

    <!-- Tabs -->
    <div style="display: flex; justify-content: center; border-bottom: 1px solid #EEE; margin-bottom: 35px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1px;">
        <div style="padding: 10px 20px; border-bottom: 2px solid #111; color: #111; cursor: pointer;">SIGN IN</div>
        <div style="padding: 10px 20px; color: #999; cursor: pointer; transition: color 0.2s;">SIGN UP</div>
    </div>

    <!-- Headers -->
    <h2 style="font-family: 'Playfair Display', serif; font-size: 26px; color: #111; margin: 0;">Welcome Back</h2>
    <p style="font-family: 'Montserrat', sans-serif; font-size: 10px; color: #666; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 8px; margin-bottom: 30px;">AI Spatial Studio Workspace</p>

    <!-- Form -->
    <form action="/studio" method="POST" style="text-align: left;">
        
        <label style="font-family: 'Montserrat', sans-serif; font-size: 10px; color: #444; font-weight: 700; letter-spacing: 1px; display: block; margin-bottom: 8px;">EMAIL ADDRESS</label>
        <input type="email" value="designer@kohler.com" style="width: 100%; padding: 14px 15px; margin-bottom: 20px; border: 1px solid #DDD; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 14px; background: #FAFAFA; box-sizing: border-box; outline: none;">

        <label style="font-family: 'Montserrat', sans-serif; font-size: 10px; color: #444; font-weight: 700; letter-spacing: 1px; display: block; margin-bottom: 8px;">PASSWORD</label>
        <input type="password" value="kohlerdemo2026" style="width: 100%; padding: 14px 15px; margin-bottom: 30px; border: 1px solid #DDD; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 14px; background: #FAFAFA; box-sizing: border-box; outline: none;">

        <button type="submit" style="width: 100%; background: #111; color: #FFF; padding: 16px; border: none; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; cursor: pointer; margin-bottom: 20px; transition: background 0.2s;">SIGN IN</button>
        
        <div style="text-align: center; font-family: 'Montserrat', sans-serif; font-size: 10px; color: #999; margin-bottom: 20px;">OR</div>
        
        <button type="button" style="width: 100%; background: #FFF; color: #111; padding: 14px; border: 1px solid #CCC; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: background 0.2s;">
            <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            CONTINUE WITH GOOGLE
        </button>

    </form>
</div>
</section>
{% endblock %}

{% block scripts %}
<script>
    function switchAuthTab(tab) {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.style.display = 'none');
        
        document.getElementById('tab-' + tab).classList.add('active');
        document.getElementById('form-' + tab).style.display = 'block';
    }
</script>
{% endblock %}
